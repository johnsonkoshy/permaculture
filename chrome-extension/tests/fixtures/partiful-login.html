<!doctype html>
<html><head><title>Log in | Partiful</title></head>
<body>
<!-- A sign-in page in a tab the helper opened: nothing here may be filled. -->
<main>
  <form id="login">
    <h1>Welcome back</h1>
    <label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel">
    <label for="nm">Your name</label><input id="nm" type="text" autocomplete="name">
    <button type="submit">Send code</button>
  </form>
</main>
</body></html>
